[workspace]
resolver = "2"
members = [
    "crates/tx-core",
    "crates/tx-evm",
    "crates/tx-solana",
    "crates/tx-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Vinisilva0010/tx-finalizer"

[workspace.dependencies]
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# HTTP client para adaptadores RPC
[workspace.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]
